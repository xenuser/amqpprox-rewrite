# Destination vhost per AMQP user, for --rewriteVhostUserMap.
#
# One "username vhost" pair per line, separated by spaces or tabs.
# Connections to the source vhost (--rewriteVhostFrom, default "/") are
# rewritten to the vhost of the username the client logs in with. Usernames
# are case-sensitive. Users not listed here go to --rewriteVhostTo if it is
# set, otherwise their connection is refused (AMQP 530).
#
# Grant each broker user permissions only on its own vhost, and map each
# destination vhost to a farm or backend in control.conf (or use MAP DEFAULT).
# Restart the service after changing this file.
#
# userA  app1
# userB  app2
